# Netlify build config for Nuxt 4 (static site generation).
# We use `nuxt generate` so the whole site is pre-rendered HTML —
# fast, cheap, and no Netlify Functions needed.

[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Make sure deep links like /about, /experience etc. work on direct visits
# by falling back to the generated 200.html (Nuxt creates one automatically).
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
